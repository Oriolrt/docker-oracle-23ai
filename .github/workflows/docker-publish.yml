name: Build, test and push to Docker Hub

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_NAME: oriolrt/oracle-23ai
  TEST_TAG: oracle-23ai:ci-test

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local only, for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.TEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d --name ci-oracle -e ORACLE_PWD=oracle ${{ env.TEST_TAG }}

      - name: Wait for sshd and crond to start
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if docker exec ci-oracle pgrep -x sshd >/dev/null 2>&1 && \
               docker exec ci-oracle pgrep -x crond >/dev/null 2>&1; then
              echo "sshd and crond are running"
              exit 0
            fi
            sleep 5
          done
          echo "::error::sshd/crond did not start within 150s"
          docker logs ci-oracle
          exit 1

      - name: Check oracle user's SSH client config was created
        run: |
          set -euo pipefail
          docker exec ci-oracle test -f /home/oracle/.ssh/config
          docker exec ci-oracle grep -qF "StrictHostKeyChecking=no" /home/oracle/.ssh/config

      - name: Wait for database to be ready
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if docker logs ci-oracle 2>&1 | grep -q "DATABASE IS READY TO USE"; then
              echo "database ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error::database did not report ready within 300s"
          docker logs ci-oracle
          exit 1

      - name: Check sqlplus / as sysdba connects
        run: |
          set -euo pipefail
          # The "DATABASE IS READY TO USE" banner can print a few seconds
          # before the local instance actually accepts bequeath connections
          # (seen as ORA-12547: TNS:lost contact right after it appears), so
          # retry instead of treating the first attempt as final.
          for i in $(seq 1 12); do
            if result=$(docker exec -u oracle ci-oracle bash -lc "echo \"select 'DB_OK' from dual;\" | sqlplus -s / as sysdba" 2>&1) && echo "$result" | grep -q "DB_OK"; then
              echo "$result"
              exit 0
            fi
            sleep 10
          done
          echo "::error::sqlplus / as sysdba never connected successfully"
          echo "$result"
          exit 1

      - name: Check a cron job actually executes as the oracle user
        run: |
          set -euo pipefail
          docker exec -u oracle ci-oracle bash -c 'crontab -l > /tmp/orig-crontab.txt; ( crontab -l; echo "* * * * * id > /home/oracle/cron-ran.txt 2>&1" ) | crontab -'
          fired=0
          for i in $(seq 1 18); do
            if docker exec -u oracle ci-oracle test -f /home/oracle/cron-ran.txt; then
              fired=1
              break
            fi
            sleep 5
          done
          docker exec -u oracle ci-oracle bash -c 'crontab /tmp/orig-crontab.txt; rm -f /home/oracle/cron-ran.txt'
          if [ "$fired" -ne 1 ]; then
            echo "::error::cron job never executed within 90s (crond may be failing to open a PAM session)"
            exit 1
          fi
          echo "cron job fired as oracle"

      - name: Restart container and check provisioning is idempotent
        run: |
          set -euo pipefail
          docker restart ci-oracle
          for i in $(seq 1 30); do
            if docker exec ci-oracle pgrep -x sshd >/dev/null 2>&1 && \
               docker exec ci-oracle pgrep -x crond >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          marker_count=$(docker exec ci-oracle sh -c "grep -c '# --- oracle-23ai environment (managed) ---' /home/oracle/.bash_profile || true")
          if [ "$marker_count" -ne 1 ]; then
            echo "::error::.bash_profile environment block got duplicated after restart ($marker_count copies)"
            exit 1
          fi

          cron_count=$(docker exec ci-oracle sh -c "crontab -l | grep -c delete_trc.sh || true")
          if [ "$cron_count" -ne 1 ]; then
            echo "::error::cron entry got duplicated after restart ($cron_count copies)"
            exit 1
          fi

      - name: Clean up test container
        if: always()
        run: docker rm -f ci-oracle || true

  publish:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: echo "value=${{ github.event.release.tag_name || 'manual' }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest
